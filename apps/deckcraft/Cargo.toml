[package]
name = "deckcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft desktop app"
publish = false
default-run = "deckcraft"

[lints]
workspace = true

[dependencies]
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
deckcraft-media = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "links", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for deckcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The system's preferred languages, for the East Asian editing language (MIT OR Apache-2.0).
sys-locale = "0.3"
rfd = { workspace = true }
arboard = { workspace = true, features = ["image-data"] }
image = { workspace = true }
cpal = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
# Finder double-click, Open With, Dock drops and `open -a DeckCraft deck.pptx` arrive as a
# kAEOpenDocuments Apple event, which winit 0.30 doesn't handle. This audited crate (also used by
# GridCraft, PdfCraft and PhotoCraft) registers the handler (Objective-C interop needs unsafe, which
# our workspace forbids) behind a safe API. Pinned exactly: review the diff before bumping.
fmv-macos-events = "=0.1.0"
# The vendored winit (`vendor/winit`, patched in the workspace manifest): the text around the
# caret is reported to the input method each frame, so it can read committed text and reconvert
# it (`main.rs`, `deckcraft_ui_egui::ime`). Already in the build through eframe, at this version.
winit = { version = "0.30", default-features = false }
# The screen's work area (the desktop less the menu bar and the Dock), for Arrange All and Cascade
# (`screens.rs`): safe calls in these bindings. Already in the build through winit, rfd and
# arboard, at this version; this adds only the application, window and screen bindings.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSResponder", "NSScreen", "NSGraphics", "NSEvent", "NSMenu", "NSMenuItem"] }
objc2 = "0.6"
# The native menu bar (`mac_menu`): AppKit menus through the same backend as WordCraft and
# PhotoCraft, which keeps the Objective-C interop (unsafe, which our workspace forbids) behind a
# safe API. No GTK: only macOS has it. Pinned exactly: review the diff before bumping.
muda = { version = "=0.21.2", default-features = false }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# `tests/mac_menu_appkit.rs` reads the installed menu bar back and dispatches its items as AppKit does.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSGraphicsContext", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[[test]]
name = "mac_menu_appkit"
harness = false

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }
